<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOC'S Classroom Traffic Light</title><style>body{margin:0;background:#101827;color:white;font:20px Arial;text-align:center}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:clamp(26px,4vw,48px)}#signal{border-radius:22px;background:#202b3d;padding:20px;margin:20px auto;max-width:650px}#word{font-size:clamp(44px,8vw,100px);font-weight:900}#instruction{font-size:clamp(24px,4vw,44px)}button{font-size:18px;padding:12px 18px;margin:6px;border:0;border-radius:10px;cursor:pointer}label{display:inline-block;margin:10px}input{width:140px}small{display:block;color:#ddd}#controls{background:#263248;border-radius:14px;padding:15px}body.green #signal{background:#12783b}body.yellow #signal{background:#c78b08;color:#161616}body.red #signal{background:#bc202b}#status{font-size:15px}</style></head><body class="green"><main><h1>DOC'S CLASSROOM TRAFFIC LIGHT</h1><section id="signal"><div id="word">GREEN</div><div id="instruction">GOOD VOLUME</div></section><div id="controls"><button id="start">Start microphone</button><button id="cal">Calibrate quiet classroom</button><button id="test">Test alert</button><button id="mute">Sound: OFF</button><button id="full">Full screen</button><div><label>Yellow threshold <input id="yellow" type="range" min="5" max="70" value="20"><output id="yv">20</output></label><label>Red threshold <input id="red" type="range" min="10" max="100" value="40"><output id="rv">40</output></label><label>Alert volume <input id="vol" type="range" min="0" max="30" value="8"><output id="vv">8%</output></label></div><small>Alert is a low-volume, short electronic pulse (maximum 5 seconds; 30-second cooldown). The microphone pauses briefly during each pulse to reduce feedback. Adjust thresholds for your room.</small><p id="status">Microphone not started.</p></div></main><script>
let ctx,analyser,data,stream,muted=true,baseline=0,level=0,redSince=0,lastAlert=-30000,alertUntil=0,pulseUntil=0,osc=null,gain=null,state='green';const $=id=>document.getElementById(id);function paint(s){if(state===s)return;state=s;document.body.className=s;$('word').textContent=s.toUpperCase();$('instruction').textContent=s==='red'?'TOO LOUD — LOWER YOUR VOICES':s==='yellow'?'GETTING TOO LOUD':'GOOD VOLUME';if(s!=='red')stopTone()}function stopTone(){if(osc){try{osc.stop()}catch(e){}osc=null}if(gain){gain.disconnect();gain=null}pulseUntil=0}function beep(){if(muted||!ctx)return;stopTone();osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.frequency.value=650;gain.gain.value=Number($('vol').value)/100*0.12;osc.connect(gain).connect(ctx.destination);osc.start();pulseUntil=performance.now()+170;setTimeout(stopTone,170)}function tick(t){if(analyser){analyser.getByteTimeDomainData(data);let sum=0;for(let x of data){let v=(x-128)/128;sum+=v*v}let rms=Math.sqrt(sum/data.length)*300;level=level*.8+rms*.2;let adjusted=Math.max(0,level-baseline);if(t>=pulseUntil){let y=+$('yellow').value,r=+$('red').value;paint(adjusted>r?'red':adjusted>y?'yellow':'green')}if(state==='red'){if(!redSince)redSince=t;if(!muted&&t-lastAlert>30000&&t-redSince>500){lastAlert=t;alertUntil=t+5000}if(!muted&&t<alertUntil&&t>pulseUntil+500)beep()}else{redSince=0;alertUntil=0}}requestAnimationFrame(tick)}$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});ctx=new AudioContext();await ctx.resume();analyser=ctx.createAnalyser();analyser.fftSize=2048;data=new Uint8Array(analyser.fftSize);ctx.createMediaStreamSource(stream).connect(analyser);$('status').textContent='Microphone active. Speak normally and calibrate.';$('start').disabled=true;requestAnimationFrame(tick)}catch(e){$('status').textContent='Microphone unavailable: '+e.message+' — allow microphone access in Chrome.'}};$('cal').onclick=()=>{baseline=level;$('status').textContent='Calibrated. Quiet group work is the baseline.'};$('mute').onclick=async()=>{muted=!muted;$('mute').textContent='Sound: '+(muted?'OFF':'ON');if(muted){stopTone();alertUntil=0}else if(ctx)await ctx.resume()};$('test').onclick=async()=>{if(!ctx){ctx=new AudioContext()}await ctx.resume();beep()};$('full').onclick=()=>document.documentElement.requestFullscreen?.();for(let id of ['yellow','red','vol'])$(id).oninput=()=>$(id==='yellow'?'yv':id==='red'?'rv':'vv').textContent=$(id).value+(id==='vol'?'%':'');</script></body></html>
